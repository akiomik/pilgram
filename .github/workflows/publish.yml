name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  # Builds the distributions, which runs hatchling and the build dependencies
  # it pulls from PyPI, so this job can only read the repository. The publish
  # job uploads what it builds.
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: false

      - name: Check that the tag matches the package version
        run: |
          version="$(python3 -c 'import runpy; print(runpy.run_path("pilgram/_version.py")["__version__"])')"
          if [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Build package
        run: make build

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          # Long enough to re-run the publish job after a failed upload.
          retention-days: 7

  # Uploads the distributions. Any step in this job can request the OIDC
  # token, so it runs no build and no dependency code: only download-artifact,
  # a check with the runner's own Python and PyPA's publish action.
  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI Trusted Publishing (OIDC).
      id-token: write

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      # The build job names the files and writes their metadata, so check
      # both against the tag before uploading any of it.
      - name: Check the distributions
        shell: python3 {0}
        run: |
          import os
          import sys
          import tarfile
          import zipfile
          from email.parser import Parser

          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("v")
          wheel = f"pilgram-{version}-py3-none-any.whl"
          sdist = f"pilgram-{version}.tar.gz"

          found = sorted(os.listdir("dist"))
          if found != sorted([wheel, sdist]):
              sys.exit(f"expected {wheel} and {sdist} for {tag}, found {found}")

          def check(where, metadata):
              fields = Parser().parsestr(metadata)
              if (fields["Name"], fields["Version"]) != ("pilgram", version):
                  sys.exit(f"{where} is {fields['Name']} {fields['Version']}, not pilgram {version}")

          with zipfile.ZipFile(f"dist/{wheel}") as archive:
              check(wheel, archive.read(f"pilgram-{version}.dist-info/METADATA").decode())
          with tarfile.open(f"dist/{sdist}") as archive:
              check(sdist, archive.extractfile(f"pilgram-{version}/PKG-INFO").read().decode())

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
